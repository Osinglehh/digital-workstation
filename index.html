<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字工位 · 可交互 3D 工作区</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --ink: #2c2b29;
        --muted: #7b766d;
        --paper: #eee9e0;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
        transition: background 260ms ease;
      }
      #app { position: fixed; inset: 0; display: grid; place-items: center; }
      #stage {
        position: relative;
        width: min(100vw, calc(100vh * 4 / 3));
        aspect-ratio: 4 / 3;
        overflow: hidden;
        background: #e9e4db;
        box-shadow: 0 20px 60px rgba(40, 34, 25, 0.18);
        transition: background 260ms ease, box-shadow 260ms ease;
      }
      :root[data-theme="dark"] #stage {
        background: #131315;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      @media (max-width: 860px), (max-height: 560px) {
        #stage {
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          aspect-ratio: auto;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage" aria-label="可交互 3D 数字工位"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
